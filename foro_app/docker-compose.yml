# Foro — sobe TUDO (MySQL + API + frontend) com um comando:
#
#   cp .env.example .env        # preencha os segredos (obrigatórios: JWT_SECRET, DB_PASSWORD, DB_ROOT_PASSWORD, FRONTEND_URL)
#   docker compose up -d --build
#
# A aplicação escuta só em 127.0.0.1:3040 — o acesso público é pelo nginx (HTTPS), ver deploy/nginx.conf.example.
# O MySQL NÃO é publicado no host: só a API o alcança, pela rede interna do Docker.
# O schema base (backend/configs/init.sql) é aplicado na PRIMEIRA subida do MySQL (volume vazio); toda
# mudança posterior vem de backend/migrations/, aplicada sozinha no boot da API (git pull + up -d --build).
# Para recriar do zero (APAGA OS DADOS):  docker compose down -v

services:
  db:
    image: mysql:8.0
    container_name: foro_db
    restart: unless-stopped
    # Fuso de Brasília no servidor: casa com `timezone: '-03:00'` do pool (db.config.js),
    # senão CURRENT_TIMESTAMP (UTC) e datas enviadas pela API ficariam 3h defasados.
    command: ["--default-time-zone=-03:00", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:?defina DB_ROOT_PASSWORD no .env}"
      MYSQL_DATABASE: ${DB_NAME:-foro_db}
      MYSQL_USER: ${DB_USER:-foro_user}
      MYSQL_PASSWORD: "${DB_PASSWORD:?defina DB_PASSWORD no .env}"
    # (sem "ports": o banco não fica exposto na internet)
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }
    volumes:
      - foro_db_data:/var/lib/mysql
      - ./backend/configs/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: foro_app
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-3040}:3040"   # só o nginx do host acessa; nada de 0.0.0.0
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3040
      TRUST_PROXY: ${TRUST_PROXY:-1}           # 1 = confia no X-Forwarded-For do nginx
      CORS_ORIGIN: ${CORS_ORIGIN:-${FRONTEND_URL}}
      FRONTEND_URL: "${FRONTEND_URL:?defina FRONTEND_URL no .env - ex https://app.seudominio.com.br}"
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-foro_db}
      DB_USER: ${DB_USER:-foro_user}
      DB_PASSWORD: "${DB_PASSWORD:?defina DB_PASSWORD no .env}"
      JWT_SECRET: "${JWT_SECRET:?defina JWT_SECRET no .env - gere com openssl rand -hex 32}"
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-Foro <onboarding@resend.dev>}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
      SUPPORT_WHATSAPP: ${SUPPORT_WHATSAPP:-}
      SUPPORT_HOURS: ${SUPPORT_HOURS:-}
      DIGEST_HOUR: ${DIGEST_HOUR:-7}
      DEADLINE_DIGEST: ${DEADLINE_DIGEST:-on}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5-5}
      DOCUMENT_TEMPLATES_DIR: ${DOCUMENT_TEMPLATES_DIR:-/app/modelos}   # modelos do escritório (sobrepõem os embutidos) — ver documentation/documentos-e-modelos.md
      FEATURE_LOOKUPS_ENABLED: ${FEATURE_LOOKUPS_ENABLED:-false}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      NFEIO_WEBHOOK_TOKEN: ${NFEIO_WEBHOOK_TOKEN:-}
      NFEIO_API_KEY: ${NFEIO_API_KEY:-}
      NFEIO_COMPANY_ID: ${NFEIO_COMPANY_ID:-}
      NFEIO_BASE_URL: ${NFEIO_BASE_URL:-https://api.nfe.io/v1}
      CNPJ_PROVIDER_BASE_URL: ${CNPJ_PROVIDER_BASE_URL:-}
      CNPJ_PROVIDER_API_KEY: ${CNPJ_PROVIDER_API_KEY:-}
      CPF_PROVIDER_BASE_URL: ${CPF_PROVIDER_BASE_URL:-}
      CPF_PROVIDER_API_KEY: ${CPF_PROVIDER_API_KEY:-}
      PROCESS_PROVIDER_BASE_URL: ${PROCESS_PROVIDER_BASE_URL:-}
      PROCESS_PROVIDER_API_KEY: ${PROCESS_PROVIDER_API_KEY:-}
      # Pesquisa de processos: "mock" devolve processos/PDF de teste. Armazenamento S3 (MinIO agora, AWS depois).
      PROCESS_SEARCH_PROVIDER: ${PROCESS_SEARCH_PROVIDER:-mock}
      S3_ENDPOINT: ${S3_ENDPOINT-http://minio:9000}   # vazio (S3_ENDPOINT=) = AWS S3 de verdade
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-foro-arquivos}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-${MINIO_ROOT_USER:-foro_minio}}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-${MINIO_ROOT_PASSWORD:-foro_minio_senha_dev}}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}   # MinIO = true · AWS S3 = false
    volumes:
      - ${MODELOS_DIR:-./modelos}:/app/modelos:ro   # pasta no servidor com os modelos de peças (<área>/<chave>.md)
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy

  # Armazenamento de arquivos compatível com S3 (processos salvos etc.). Fase de teste: o bucket é criado pela
  # própria API no boot. Para migrar para a AWS depois, basta trocar as variáveis S3_* — ver documentation/armazenamento-s3.md.
  minio:
    image: minio/minio:latest
    container_name: foro_minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-foro_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-foro_minio_senha_dev}
    ports:
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"   # console web só local (acesse por túnel SSH); a API S3 (9000) NÃO é publicada
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }
    volumes:
      - foro_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

volumes:
  foro_db_data:
  foro_minio_data:
